<!doctype html>
<html lang="az">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Inter var";
        src: url("../assets/fonts/inter-var.woff2") format("woff2");
        font-weight: 100 900;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px; height: 630px;
        background: #0a1014;
        font-family: "Inter var", sans-serif;
        color: #e8f0f4;
        display: flex; flex-direction: column; justify-content: space-between;
        padding: 72px;
        position: relative; overflow: hidden;
      }
      body::before {
        content: ""; position: absolute;
        inset: -40% 45% 20% -25%;
        background: radial-gradient(closest-side, rgba(45,212,167,.20), transparent 70%);
      }
      .brand { display: flex; align-items: center; gap: 20px; position: relative; }
      .mark {
        width: 68px; height: 68px; border-radius: 18px;
        background: linear-gradient(140deg, #2dd4a7, #1aa8d4);
        display: grid; place-items: center; color: #04221a;
      }
      .mark svg { width: 38px; height: 38px; }
      .brand span { font-size: 38px; font-weight: 700; letter-spacing: -.03em; }
      h1 {
        font-size: 76px; font-weight: 660; line-height: 1.08;
        letter-spacing: -.04em; max-width: 17ch; position: relative;
      }
      .accent { color: #2dd4a7; }
      .foot { display: flex; gap: 40px; position: relative; }
      .foot div { display: flex; flex-direction: column; gap: 4px; }
      .foot strong { font-size: 34px; color: #2dd4a7; letter-spacing: -.02em; }
      .foot span { font-size: 19px; color: #93a9b4; }
    </style>
  </head>
  <body>
    <div class="brand">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7h11v10H3z" /><path d="M14 10h4l3 3v4h-7z" />
          <circle cx="7" cy="18" r="2" /><circle cx="17" cy="18" r="2" />
        </svg>
      </span>
      <span>Xəzər Ekspres</span>
    </div>

    <h1>Bakıdan bütün Azərbaycana — <span class="accent">yükünüz vaxtında çatır</span></h1>

    <div class="foot">
      <div><strong>12</strong><span>filial</span></div>
      <div><strong>99,2%</strong><span>vaxtında çatdırılma</span></div>
      <div><strong>24-48 saat</strong><span>regionlara</span></div>
    </div>
  </body>
</html>
